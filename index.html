<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aetherbound — Overworld</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #05070c; overflow: hidden; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eaf2ff; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #05070c; z-index: 50; transition: opacity .6s ease;
        letter-spacing: .35em; font-size: 12px; text-transform: uppercase; color: #7f93b8;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <div id="boot">Loading</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
